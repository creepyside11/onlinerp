name: build-apk

# Сборка идёт в облаке: локально не нужно ни Android SDK, ни места на диске.
# На выходе — готовый подписанный APK в артефактах запуска.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Ссылка на исходный APK (пусто — взять из релиза base)'
        required: false
      frida_version:
        description: 'Версия Frida gadget'
        required: false
        default: '17.27.4'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'build/**'
      - '.github/workflows/build.yml'

env:
  FRIDA_VERSION: ${{ inputs.frida_version || '17.27.4' }}
  BASE_APK_URL: ${{ inputs.apk_url || 'https://github.com/creepyside11/onlinerp/releases/download/base/onlinerp_launcher.apk' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Системные инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf xz-utils unzip

      - name: Java для подписи
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: zipalign и apksigner
        run: |
          # На раннере GitHub уже есть Android SDK, поэтому отдельный action
          # установки не нужен: он падает на принятии лицензий, а нужные
          # бинарники и так на месте.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK не найден в $SDK" >&2
            exit 1
          fi

          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BT" ]; then
            echo "build-tools нет, ставлю 34.0.0"
            yes | "$SDK"/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null
            BT="$SDK/build-tools/34.0.0"
          fi

          echo "$BT" >> "$GITHUB_PATH"
          echo "build-tools: $BT"
          ls "$BT" | head

      - name: Проверить агент
        run: |
          which zipalign apksigner patchelf
          python3 build/bundle.py
          node --check build/agent.js
          node build/smoke.js

      - name: Скачать Frida gadget
        run: |
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-android-arm64.so.xz"
          echo "качаю $URL"
          curl -fsSL -o gadget.xz "$URL"
          unxz gadget.xz
          mv gadget frida-gadget.so
          ls -la frida-gadget.so

      - name: Скачать исходный APK
        run: |
          curl -fsSL -o base.apk "$BASE_APK_URL"
          ls -la base.apk
          unzip -l base.apk | grep -c "lib/arm64-v8a/" || true

      - name: Ключ для подписи
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "использую ключ из секретов"
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias rakcrmp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass rakcrmp123 -keypass rakcrmp123 \
              -dname "CN=RakCRMP, O=RakCRMP, C=RU"
          fi

      - name: Собрать APK
        run: |
          python3 build/patch_apk.py \
            --apk base.apk \
            --gadget frida-gadget.so \
            --script build/agent.js \
            --keystore release.keystore \
            --storepass rakcrmp123 \
            --out RakCRMP.apk

      - name: Проверить сборку
        run: |
          set -e
          echo "== содержимое lib/arm64-v8a =="
          unzip -l RakCRMP.apk | grep "lib/arm64-v8a/" | grep -E "gadget|script" || true

          echo "== gadget подключён к libClient.so? =="
          mkdir -p verify && cd verify
          unzip -o -q ../RakCRMP.apk "lib/arm64-v8a/*"
          readelf -d lib/arm64-v8a/libClient.so | grep -i needed
          test -f lib/arm64-v8a/libgadget.so
          test -f lib/arm64-v8a/libgadget.config.so
          test -f lib/arm64-v8a/libscript.so
          echo "конфиг gadget:"
          cat lib/arm64-v8a/libgadget.config.so

          echo "== подпись =="
          cd .. && apksigner verify --print-certs RakCRMP.apk | head -4

      - name: Итог
        run: |
          ls -la RakCRMP.apk
          du -h RakCRMP.apk

      - name: Выложить в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest > /dev/null 2>&1 || \
            gh release create latest --title "RakCRMP — последняя сборка" \
              --notes "Меню поверх Online RP. Скачать APK и установить."
          gh release upload latest RakCRMP.apk --clobber
          echo "ссылка: https://github.com/creepyside11/onlinerp/releases/download/latest/RakCRMP.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RakCRMP-apk
          path: RakCRMP.apk
          retention-days: 14
